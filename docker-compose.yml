version: '3.8'

services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: digital-menu-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-hotel_menu_system}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Tare@kiya}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount initialization scripts in order
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/migration_v2.sql:/docker-entrypoint-initdb.d/02-migration_v2.sql:ro
      - ./database/migration_v3_actor_model.sql:/docker-entrypoint-initdb.d/03-migration_v3_actor_model.sql:ro
      - ./database/create_test_users.sql:/docker-entrypoint-initdb.d/04-create_test_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Service (Node.js)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: digital-menu-backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-hotel_menu_system}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-Tare12@kiya}
      - JWT_SECRET=${JWT_SECRET:-hotel_menu_system_jwt_secret_key_2024_change_this_in_production}
      - JWT_EXPIRE=7d
      - CORS_ORIGIN=http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # Frontend Service (React + Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api
        - VITE_API_URL=http://localhost:5000
    container_name: digital-menu-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
